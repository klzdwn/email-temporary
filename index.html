<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Sementara</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 8px; color: #111827; }
    p.desc { font-size: 14px; color: #6b7280; margin-bottom: 20px; }
    .email-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
    button { padding: 10px 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn-copy { background: #e5e7eb; color: #374151; }
    .btn-new { background: #2563eb; color: white; }
    .status { font-size: 13px; color: #10b981; margin-bottom: 20px; font-weight: bold; }
    ul { list-style: none; }
    li { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .sender { font-size: 13px; font-weight: bold; color: #111; }
    .subject { font-size: 14px; color: #2563eb; margin: 4px 0; }
    .snippet { font-size: 12px; color: #6b7280; }
    .empty { text-align: center; color: #9ca3af; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📧 Email Sementara</h2>
    <p class="desc">Email otomatis diperbarui setiap 5 detik.</p>

    <div class="email-box">
      <input type="text" id="emailInput" readonly value="Sedang membuat email...">
      <button class="btn-copy" onclick="copyEmail()">Salin</button>
      <button class="btn-new" onclick="getNewEmail()">Buat Baru</button>
    </div>

    <div class="status" id="statusText">Status: Memuat...</div>

    <h3>Inbox Masuk:</h3>
    <ul id="inboxList" style="margin-top: 10px;">
      <li class="empty">Belum ada email masuk...</li>
    </ul>
  </div>

  <script>
    let sidToken = '';

    // 1. Ambil Email Baru dari GuerrillaMail
    async function getNewEmail() {
      document.getElementById('emailInput').value = "Sedang membuat email...";
      document.getElementById('statusText').innerText = "Status: Menghubungkan server...";

      try {
        const res = await fetch('https://api.guerrillamail.com/ajax.php?f=get_email_address');
        const data = await res.json();

        sidToken = data.sid_token;
        document.getElementById('emailInput').value = data.email_addr;
        document.getElementById('statusText').innerText = "Status: Aktif";

        checkInbox();
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').innerText = "Status: Gagal terhubung ke API.";
      }
    }

    // 2. Cek Inbox
    async function checkInbox() {
      if (!sidToken) return;

      try {
        const res = await fetch(`https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=${sidToken}&seq=0`);
        const data = await res.json();
        const messages = data.list || [];

        const inboxList = document.getElementById('inboxList');

        // Filter pesan default dari GuerrillaMail
        const realMessages = messages.filter(msg => msg.mail_from !== 'no-reply@guerrillamail.com');

        if (realMessages.length === 0) {
          inboxList.innerHTML = '<li class="empty">Belum ada email masuk...</li>';
          return;
        }

        inboxList.innerHTML = '';
        realMessages.forEach(msg => {
          const li = document.createElement('li');
          li.innerHTML = `
            <div class="sender">Dari: ${msg.mail_from}</div>
            <div class="subject">${msg.mail_subject}</div>
            <div class="snippet">${msg.mail_excerpt}</div>
          `;
          inboxList.appendChild(li);
        });
      } catch (err) {
        console.error("Gagal cek inbox:", err);
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('emailInput');
      if (!emailInput.value || emailInput.value.includes('...')) return;
      navigator.clipboard.writeText(emailInput.value);
      alert('Email berhasil disalin!');
    }

    // Jalankan awal
    getNewEmail();
    setInterval(checkInbox, 5000);
  </script>

</body>
</html>
